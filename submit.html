<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>최종 결과물 제출 · UN 기구 공개 채용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2312284b'/><ellipse cx='16' cy='16' rx='6' ry='14' fill='none' stroke='white' stroke-width='1.5'/><path d='M2 16h28' stroke='white' stroke-width='1.5'/></svg>">
<style>
:root{--ink:#12284b;--ink2:#1d3a6b;--un:#1f7fc4;--sky:#dcebf7;--paper:#fff;--desk:#eef2f7;--red:#e0482f;--line:#cfdae6;--mute:#56667c;--ok:#1d8750;
  --serif:"Noto Serif KR",serif;--sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--un);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.bar{background:var(--ink);color:#fff}
.bar .wrap{display:flex;align-items:center;gap:9px;min-height:56px;font-family:var(--serif);font-weight:900}
.banner{position:relative;height:220px;overflow:hidden;background:var(--ink)}
.banner img{width:100%;height:100%;object-fit:cover;object-position:center 40%}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,40,75,.1),rgba(12,28,54,.85))}
.banner .wrap{position:absolute;left:0;right:0;bottom:22px;z-index:1;color:#fff}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.25;margin:0}
.banner p{margin:4px 0 0;color:#dfe9f5}
.panel{background:var(--paper);border-radius:10px;box-shadow:0 10px 30px rgba(18,40,75,.12);padding:clamp(20px,4vw,32px);margin:-10px 0 60px;position:relative;z-index:2}
.steps{margin:0 0 18px;padding:14px 16px 14px 34px;background:var(--sky);border-radius:8px}
.steps li{margin:2px 0}
.idrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.idrow{grid-template-columns:1fr}}
label{display:block;font-weight:700;margin-top:16px}
label small{display:block;font-weight:400;color:var(--mute);font-size:.88rem}
input[type=text],textarea{width:100%;margin-top:6px;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe}
input:focus,textarea:focus{border-color:var(--un);background:#fff}
textarea{min-height:320px;resize:vertical;line-height:1.6;font-size:.94rem}
.cnt{text-align:right;font-size:.82rem;color:var(--mute)}
.bad{border-color:var(--red)!important;background:#fff5f3!important}
.warn{margin-top:14px;padding:12px 14px;border-radius:8px;background:#fff8e8;border:1px solid #f1dfb5;font-size:.93rem}
.alert{margin-top:14px;padding:12px 14px;border-radius:8px;background:#fff1ee;color:#8f2616;font-size:.94rem}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--red);background:var(--red);color:#fff;padding:13px 24px;border-radius:40px;font-weight:700;cursor:pointer;min-height:48px;width:100%;margin-top:20px;font-size:1.02rem}
.btn:disabled{opacity:.55;cursor:wait}
.lock{font-size:.88rem;color:var(--mute);text-align:center;margin-top:10px}

.done{text-align:center}
.stamp{width:120px;height:120px;margin:6px auto 14px;border:5px double var(--red);border-radius:50%;color:var(--red);display:grid;place-items:center;font-family:var(--serif);font-weight:900;line-height:1.2;transform:rotate(-12deg)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:hit .5s cubic-bezier(.2,1.6,.4,1)}}
@keyframes hit{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.done h2{font-family:var(--serif);font-weight:900;margin:0}
.done table{margin:16px auto 0;border-collapse:collapse;font-size:.95rem}
.done td{padding:6px 12px;border-top:1px dashed var(--line);text-align:left}
.done td:first-child{color:var(--mute)}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <svg width="24" height="24" viewBox="0 0 34 34" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true"><circle cx="17" cy="17" r="15"/><ellipse cx="17" cy="17" rx="6.5" ry="15"/><path d="M2 17h30M4.5 9.5h25M4.5 24.5h25"/></svg>
  UN 기구 공개 채용
</div></header>

<div class="banner">
  <img src="img/ending.webp" alt="">
  <div class="wrap"><h1>최종 결과물 제출</h1><p>한 사람당 한 번만 낼 수 있고, 낸 뒤에는 고칠 수 없습니다.</p></div>
</div>

<main class="wrap">
  <section class="panel" id="form">
    <ol class="steps">
      <li>활동 화면의 <b>최종 제출</b> 단계에서 <b>최종 제출물 전체 복사</b>를 누릅니다.</li>
      <li>아래 칸에 붙여 넣고, 학번과 이름을 확인합니다.</li>
      <li><b>제출하기</b>를 누르면 끝입니다.</li>
    </ol>
    <div class="idrow">
      <label>학번<input type="text" id="sid" inputmode="numeric" autocomplete="off" placeholder="예: 20315"></label>
      <label>이름<input type="text" id="name" autocomplete="off" placeholder="예: 김유엔"></label>
    </div>
    <label>최종 제출물<small>복사한 내용을 그대로 붙여 넣으세요. 붙여 넣으면 학번과 이름이 자동으로 채워집니다.</small>
      <textarea id="text" placeholder="[UN 기구 공개 채용] 지원서&#10;학번: … / 이름: …&#10;…"></textarea></label>
    <div class="cnt" id="cnt">0자</div>
    <div id="msg"></div>
    <button class="btn" id="send">제출하기</button>
    <p class="lock">제출한 뒤에는 고치거나 다시 낼 수 없습니다.</p>
  </section>

  <section class="panel done" id="done" hidden>
    <div class="stamp">제출<br>완료</div>
    <h2 id="doneTitle">제출했습니다</h2>
    <p class="mute" id="doneNote">선생님께 전달되었습니다. 이 화면을 닫아도 됩니다.</p>
    <table><tbody id="doneTable"></tbody></table>
  </section>
</main>

<script src="config.js"></script>
<script>
const API = String((window.UN_CONFIG || {}).API_URL || "").trim();
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MARK = "[UN 기구 공개 채용]";

function count() { $("#cnt").textContent = `${$("#text").value.trim().length.toLocaleString()}자`; }
// 붙여 넣은 글의 "학번: 20315 / 이름: 김유엔"에서 빈 칸을 채웁니다.
function fillIdentity() {
  const t = $("#text").value;
  const m = t.match(/학번:\s*([^\s/]+)\s*\/\s*이름:\s*([^\s/\n]+)/);
  if (!m) return;
  if (!$("#sid").value.trim()) $("#sid").value = m[1];
  if (!$("#name").value.trim()) $("#name").value = m[2];
}
$("#text").addEventListener("input", () => { count(); fillIdentity(); $("#text").classList.remove("bad"); });
["#sid", "#name"].forEach(s => $(s).addEventListener("input", () => $(s).classList.remove("bad")));

function showMsg(html, cls = "alert") { $("#msg").innerHTML = html ? `<div class="${cls}">${html}</div>` : ""; }
function showDone(sid, name, when, title, note) {
  $("#form").hidden = true; $("#done").hidden = false;
  $("#doneTitle").textContent = title; $("#doneNote").textContent = note;
  $("#doneTable").innerHTML = `<tr><td>학번</td><td>${esc(sid)}</td></tr><tr><td>이름</td><td>${esc(name)}</td></tr><tr><td>제출 시각</td><td>${esc(when)}</td></tr>`;
  window.scrollTo(0, 0);
}

$("#send").onclick = async () => {
  const sid = $("#sid").value.trim(), name = $("#name").value.trim(), text = $("#text").value.trim();
  showMsg("");
  const miss = [];
  if (!sid) { $("#sid").classList.add("bad"); miss.push("학번"); }
  if (!name) { $("#name").classList.add("bad"); miss.push("이름"); }
  if (text.length < 20) { $("#text").classList.add("bad"); miss.push("최종 제출물"); }
  if (miss.length) { showMsg(`${miss.join(", ")}을(를) 채우세요.`); return; }

  const idInText = text.match(/학번:\s*([^\s/]+)\s*\/\s*이름:\s*([^\s/\n]+)/);
  const warns = [];
  if (!text.includes(MARK)) warns.push("붙여 넣은 글이 활동 화면의 최종 제출물이 아닌 것 같습니다.");
  if (!text.includes("[성찰]")) warns.push("성찰 부분이 없습니다. 최종 제출물 전체를 복사했는지 확인하세요.");
  if (idInText && (idInText[1] !== sid || idInText[2] !== name)) warns.push(`글에 적힌 학번·이름(${idInText[1]} ${idInText[2]})과 입력한 학번·이름이 다릅니다.`);
  const ask = (warns.length ? warns.join("\n") + "\n\n" : "") + `${sid} ${name}(으)로 제출합니다. 제출한 뒤에는 고칠 수 없습니다. 제출할까요?`;
  if (!confirm(ask)) return;

  const btn = $("#send"); btn.disabled = true; btn.textContent = "제출하는 중…";
  let r;
  try { r = await (await fetch(API, { method: "POST", body: JSON.stringify({ action: "submit", sid, name, text }) })).json(); }
  catch (e) { r = { ok: false, error: "network" }; }
  btn.disabled = false; btn.textContent = "제출하기";

  if (r.ok) {
    try { localStorage.setItem("un-submit-done", JSON.stringify({ sid, name, when: r.submittedAt })); } catch (e) {}
    showDone(sid, name, r.submittedAt, "제출했습니다", "선생님께 전달되었습니다. 이 화면을 닫아도 됩니다.");
  } else if (r.error === "already") {
    showDone(sid, name, r.submittedAt, "이미 제출했습니다", "이 학번과 이름으로 낸 결과물이 있어 다시 낼 수 없습니다. 잘못 냈다면 선생님께 말씀드리세요.");
  } else {
    const m = { network: "인터넷 연결을 확인하고 다시 누르세요.", too_large: "글이 너무 깁니다. 최종 제출물만 붙여 넣었는지 확인하세요.", empty: "최종 제출물을 붙여 넣으세요." }[r.error] || "제출하지 못했습니다. 잠시 뒤 다시 누르세요.";
    showMsg(esc(m));
  }
};

// 이 기기에서 이미 냈으면 접수 화면을 보여 줍니다. (다른 학생이 같은 기기를 쓸 수 있게 아래 버튼 제공)
try {
  const d = JSON.parse(localStorage.getItem("un-submit-done") || "null");
  if (d) {
    showDone(d.sid, d.name, d.when, "이 기기에서 제출을 마쳤습니다", "선생님께 전달되었습니다.");
    const again = document.createElement("button");
    again.className = "btn"; again.style.background = "var(--ink)"; again.style.borderColor = "var(--ink)";
    again.textContent = "다른 학생이 이 기기로 제출하기";
    again.onclick = () => { try { localStorage.removeItem("un-submit-done"); } catch (e) {} location.reload(); };
    $("#done").append(again);
  }
} catch (e) {}
count();
</script>
</body>
</html>
